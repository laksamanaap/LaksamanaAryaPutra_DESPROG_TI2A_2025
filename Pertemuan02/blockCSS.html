<!DOCTYPE html>
<html>

<head>
    <title>CSS Layouting</title>
    <style>
        .navigasi {
            background-color: pink;
        }
    
        h1,
        h2,
        p {
            background-color: lightgreen;
        }
        .main {
            width: 600px;
            background-color: lightgreen;
        }
        .main h1, h2 { 
            background-color: pink;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="header">
            <h1>Selamat Datang Di Website Kami</h1>
        </div>
        <div class="navigasi">
            <h2>Daftar Link</h2>
            <a href="#">Link 1</a>
            <a href="#">Link 2</a>
            <a href="#">Link 3</a>
            <a href="#">Link 4</a>
            <a href="#">Link 5</a>
        </div>
    </div>
</body>

</html>
